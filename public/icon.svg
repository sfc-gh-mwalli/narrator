<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Narrator">
  <!-- Narrator: a voice becoming a waveform. Left: a microphone capsule
       (enrollment). Right: the generated narration as rising bars. -->
  <rect width="48" height="48" rx="10" fill="#0B4F6C"/>

  <!-- microphone capsule -->
  <rect x="11" y="10" width="9" height="16" rx="4.5" fill="#E8F4F8"/>
  <!-- capsule cradle -->
  <path d="M8.5 21.5a7 7 0 0 0 14 0" fill="none" stroke="#7FD1E8" stroke-width="2" stroke-linecap="round"/>
  <!-- stand -->
  <line x1="15.5" y1="28.5" x2="15.5" y2="35" stroke="#7FD1E8" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="35" x2="20" y2="35" stroke="#7FD1E8" stroke-width="2" stroke-linecap="round"/>

  <!-- generated waveform -->
  <g fill="#29B5E8">
    <rect x="27" y="21" width="2.6" height="6"   rx="1.3"/>
    <rect x="32" y="17" width="2.6" height="14"  rx="1.3"/>
    <rect x="37" y="13" width="2.6" height="22"  rx="1.3"/>
  </g>
</svg>
